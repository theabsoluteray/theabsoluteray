<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="512" viewBox="0 0 2048 512" role="img" aria-label="arlecchino — the knave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b0510"/>
      <stop offset="0.4" stop-color="#5c0d1c"/>
      <stop offset="0.68" stop-color="#750e21"/>
      <stop offset="1" stop-color="#8f1a2c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b0510" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#5c0d1c" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#750e21" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cda66d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cda66d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="2048" height="512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="2048" height="512" fill="url(#bg)"/>

    <circle cx="900" cy="200" r="460" fill="url(#glow)"/>
    <circle cx="1720" cy="470" r="380" fill="url(#glow)" opacity="0.55"/>

    <image x="900" y="0" width="1148" height="512" preserveAspectRatio="xMidYMid slice" href="https://raw.githubusercontent.com/ScobbleQ/HoYo-Assets/main/genshin/splash/10000096.png"/>

    <rect width="2048" height="512" fill="url(#fade)"/>

    <g fill="url(#ember)">
      <circle cx="250" cy="120" r="5"/>
      <circle cx="420" cy="300" r="4"/>
      <circle cx="560" cy="180" r="6"/>
      <circle cx="700" cy="380" r="4"/>
      <circle cx="180" cy="420" r="5"/>
      <circle cx="640" cy="90" r="3"/>
    </g>

    <line x1="0" y1="3" x2="2048" y2="3" stroke="#cda66d" stroke-width="6"/>
    <line x1="0" y1="509" x2="2048" y2="509" stroke="#cda66d" stroke-width="6"/>
  </g>
</svg>
